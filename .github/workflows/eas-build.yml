name: EAS Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Run EAS init (create project config if missing)
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          GIT_EMAIL: actions@github.com
          GIT_NAME: github-actions[bot]
        run: |
          echo "Logging in with EXPO_TOKEN"
          eas login --token "$EXPO_TOKEN" || true
          eas whoami || true
          # Try to initialize the EAS project non-interactively if missing
          echo "Attempting eas init non-interactive with owner and slug"
          set -e
          if [ ! -f ".eas/config.json" ]; then
            set +e
            eas init --non-interactive --yes --owner lotdw --slug baken || true
            set -e
          else
            echo ".eas/config.json already present"
          fi
          # If init created files, commit them back so subsequent runs see them
          if [ -n "$(git status --porcelain)" ]; then
            git config user.email "$GIT_EMAIL"
            git config user.name "$GIT_NAME"
            git add -A
            git commit -m "chore(ci): add eas project config via CI init" || true
            git push origin HEAD:main || true
          fi

      - name: Run EAS build (Android APK)
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          echo "Building with EAS"
          eas whoami || true
          # Run EAS build and capture JSON output
          BUILD_JSON=$(eas build -p android --profile release --non-interactive --wait --json)
          echo "$BUILD_JSON" > build.json
          # Try to locate an APK URL in the JSON and download it
          APK_URL=$(echo "$BUILD_JSON" | grep -oE 'https?://[^\" ]+\.apk' | head -n1 || true)
          if [ -n "$APK_URL" ]; then
            echo "Found APK: $APK_URL"
            curl -L "$APK_URL" -o app-release.apk
            mkdir -p artifacts
            mv app-release.apk artifacts/
          else
            echo "APK URL not found in build output. The build may be an AAB or failed to produce a direct APK URL. See build.json for details." >&2
            echo "--- build.json ---"
            cat build.json
            exit 1
          fi

      - name: Note
        run: echo "If the build succeeded, the APK is downloaded and uploaded as a workflow artifact."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/app-release.apk
